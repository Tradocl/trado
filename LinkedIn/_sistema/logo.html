<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Logo de la página de LinkedIn: "trado" degradado sobre blanco, dibujado desde el SVG.
     Se exporta a 1200x1200 (LinkedIn lo achica sin perder nitidez). Margen de sobra
     alrededor de la palabra, como pide la guía de logos. -->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; background: #fff; overflow: hidden; }
  body { display: grid; place-items: center; }
  img { width: 74%; }
</style>
</head>
<body>
<img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
</body>
</html>
