<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel NFC · Trado EtMday 2026</title>
<!-- Panel de mesa del stand: 9 cartas boca abajo, cada una con una tarjeta NFC pegada
     detrás. La carta N tiene grabado trado.cl/etm/N y abre siempre el mismo caso
     (orden en CARTAS, src/lib/casos-etm.ts); el link no delata de qué se trata.
     El QR de respaldo abre trado.cl/etm/sorpresa (un caso al azar).
     Tamaño A3 vertical (297 × 420 mm); al ser vectorial se puede imprimir en A2.
     Se genera a PDF con EtMday/panel/generar.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 420mm; margin: 0; }
  :root { --azul: #2230C2; --medio: #4B35D6; --violeta: #7C3AED; --verde: #10B981; --naranjo: #FF6B4A; --tinta: #0F1424; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 297mm; height: 420mm; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #fff;
    background: linear-gradient(150deg, var(--azul) 0%, var(--medio) 55%, var(--violeta) 100%);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    position: relative; overflow: hidden;
  }
  .brillo { position: absolute; border-radius: 50%; filter: blur(30mm); pointer-events: none; }
  .b1 { width: 160mm; height: 160mm; background: rgba(255,255,255,.12); top: -60mm; right: -50mm; }
  .b2 { width: 170mm; height: 170mm; background: rgba(16,185,129,.22); bottom: -70mm; left: -60mm; }
  .hoja { position: relative; height: 100%; padding: 16mm 15mm 12mm; display: flex; flex-direction: column; }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { height: 15mm; }
  .pill { font-size: 4.2mm; font-weight: 800; letter-spacing: .4mm; text-transform: uppercase;
          border: .5mm solid rgba(255,255,255,.55); border-radius: 99mm; padding: 2.2mm 5mm; }
  h1 { font-size: 21mm; font-weight: 800; line-height: .98; letter-spacing: -.9mm; margin-top: 9mm; }
  h1 u { text-decoration: none; background: linear-gradient(transparent 82%, var(--verde) 82%, var(--verde) 94%, transparent 94%); }
  .bajada { font-size: 7.4mm; font-weight: 500; margin-top: 4mm; opacity: .92; }

  .grilla { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6mm; margin-top: 9mm; }
  /* Cada carta mide ~84 × 82 mm: la tarjeta NFC (85,6 × 54 mm) va pegada detrás, en vertical y al centro */
  .carta { border-radius: 8mm; border: 1.6mm solid #fff; position: relative; overflow: hidden;
           box-shadow: 0 4mm 10mm rgba(10,15,60,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .carta::before { content: ""; position: absolute; inset: 4mm; border: .6mm dashed rgba(255,255,255,.4); border-radius: 5mm; }
  .carta .q { font-size: 30mm; font-weight: 800; line-height: 1; color: rgba(255,255,255,.95); text-shadow: 0 1.5mm 0 rgba(0,0,0,.15); }
  .carta .ondas { width: 10mm; height: 10mm; color: #fff; margin-top: 2mm; }
  .carta .acerca { font-size: 3.8mm; font-weight: 800; margin-top: 2mm; letter-spacing: .2mm; }
  .carta .num { position: absolute; top: 7mm; left: 8mm; font-size: 6mm; font-weight: 800; opacity: .85; }
  .c1 { background: radial-gradient(circle at 30% 20%, #4B35D6, #0F1424 70%); }
  .c2 { background: radial-gradient(circle at 70% 25%, #10B981, #064E3B 75%); }
  .c3 { background: radial-gradient(circle at 30% 80%, #FF6B4A, #7C2D12 75%); }
  .c4 { background: radial-gradient(circle at 75% 75%, #7C3AED, #2E1065 75%); }
  .c5 { background: radial-gradient(circle at 25% 30%, #38BDF8, #0C4A6E 75%); }
  .c6 { background: radial-gradient(circle at 60% 20%, #F472B6, #831843 75%); }
  .c7 { background: radial-gradient(circle at 70% 70%, #FBBF24, #78350F 75%); }
  .c8 { background: radial-gradient(circle at 30% 25%, #2DD4BF, #134E4A 75%); }
  .c9 { background: radial-gradient(circle at 50% 30%, #818CF8, #1E1B4B 75%); }

  footer { display: flex; align-items: center; gap: 7mm; margin-top: 9mm; }
  .qr { background: #fff; border-radius: 5mm; padding: 2.5mm; flex: none; }
  .qr img { width: 32mm; height: 32mm; display: block; }
  .pie { flex: 1; }
  .pie b { display: block; font-size: 6.6mm; font-weight: 800; }
  .pie span { display: block; font-size: 4.8mm; opacity: .85; margin-top: 1.5mm; }
  .web { font-weight: 800; background: #fff; color: var(--azul); border-radius: 99mm; padding: 2.6mm 7mm; font-size: 6mm; flex: none; }
</style>
</head>
<body>
  <div class="brillo b1"></div><div class="brillo b2"></div>
  <div class="hoja">
    <header>
      <img class="logo" src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20blanco.svg" alt="trado">
      <span class="pill">9 estafas reales</span>
    </header>
    <h1>Elige una carta.<br>¿La <u>detectarías</u>?</h1>
    <p class="bajada">Acerca tu celular y descubre qué estafa te toca.</p>

    <div class="grilla" id="grilla"></div>

    <footer>
      <div class="qr"><img src="../../public/etm/qr-sorpresa.svg" alt=""></div>
      <div class="pie">
        <b>¿Tu celular no tiene NFC? Escanea aquí.</b>
        <span>Con Trado, la plata queda retenida hasta que se cumple el trato.</span>
      </div>
      <span class="web">trado.cl</span>
    </footer>
  </div>

<script>
  const ondas = '<svg class="ondas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/></svg>';
  document.getElementById("grilla").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `
    <div class="carta c${n}">
      <span class="num">${n}</span>
      <span class="q">?</span>
      ${ondas}
      <span class="acerca">Acerca tu celular</span>
    </div>`).join("");
</script>
</body>
</html>
