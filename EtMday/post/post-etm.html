<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post · Trado en el EtMday</title>
<!-- Post de Instagram 1080 × 1350 anunciando el stand. Sin logo de EtMday (no es nuestro): solo
     el nombre. Caption en post-etm-caption.txt.
     Generar: node EtMday/generar.mjs EtMday/post/post-etm.html 1080px 1350px png -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --azul: #2230C2; --medio: #4B35D6; --violeta: #7C3AED; --tinta: #0F1424; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #fff; position: relative;
         background: linear-gradient(150deg, var(--azul) 0%, var(--medio) 55%, var(--violeta) 100%); }
  .brillo { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 560px; height: 560px; background: rgba(255,255,255,.13); top: -200px; right: -180px; }
  .b2 { width: 600px; height: 600px; background: rgba(124,58,237,.4); bottom: -260px; left: -200px; }
  .hoja { position: relative; height: 100%; padding: 80px 80px 70px; display: flex; flex-direction: column; }
  .arriba { display: flex; justify-content: space-between; align-items: center; }
  .logo { height: 58px; }
  .pill { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; border: 2px solid rgba(255,255,255,.6); border-radius: 99px; padding: 10px 24px; }
  .evento { margin-top: 90px; font-size: 34px; font-weight: 700; opacity: .9; }
  h1 { font-size: 104px; font-weight: 800; line-height: .98; letter-spacing: -3px; margin-top: 18px; }
  h1 u { text-decoration: none; background: linear-gradient(transparent 80%, rgba(255,255,255,.35) 80%, rgba(255,255,255,.35) 93%, transparent 93%); }
  .cartas { margin-top: 60px; display: flex; gap: 22px; }
  .carta { width: 150px; height: 200px; border-radius: 22px; border: 5px solid #fff; display: flex; align-items: center; justify-content: center;
           font-size: 96px; font-weight: 800; box-shadow: 0 20px 40px rgba(10,15,60,.35); }
  .c1 { background: radial-gradient(circle at 30% 20%, #4B35D6, #0F1424 70%); transform: rotate(-8deg); }
  .c2 { background: radial-gradient(circle at 70% 25%, #38BDF8, #0C4A6E 75%); transform: translateY(-14px); }
  .c3 { background: radial-gradient(circle at 30% 80%, #7C3AED, #2E1065 75%); transform: rotate(7deg); }
  .texto { margin-top: 56px; font-size: 38px; font-weight: 500; line-height: 1.3; max-width: 860px; }
  .texto b { font-weight: 800; }
  .pie { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .fecha b { display: block; font-size: 44px; font-weight: 800; }
  .fecha span { display: block; font-size: 28px; opacity: .85; margin-top: 4px; }
  .web { font-size: 34px; font-weight: 800; color: var(--azul); background: #fff; border-radius: 99px; padding: 14px 34px; }
</style>
</head>
<body>
  <div class="brillo b1"></div><div class="brillo b2"></div>
  <div class="hoja">
    <div class="arriba">
      <img class="logo" src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20blanco.svg" alt="trado">
      <span class="pill">Ven a jugar</span>
    </div>
    <p class="evento">Nos vemos en el EtMday 2026</p>
    <h1>¿Detectarías una <u>estafa</u>?</h1>
    <div class="cartas"><div class="carta c1">?</div><div class="carta c2">?</div><div class="carta c3">?</div></div>
    <p class="texto">Pasa por nuestro stand, <b>acerca tu celular a una carta</b> y descubre si caerías en una de las 9 estafas más comunes al comprar y vender.</p>
    <div class="pie">
      <div class="fecha"><b>19, 20 y 21 de noviembre</b><span>Parque Bicentenario, Vitacura</span></div>
      <span class="web">trado.cl</span>
    </div>
  </div>
</body>
</html>
