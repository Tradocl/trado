<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Caras del dado · Trado EtMday 2026</title>
<!-- Caras para pegar en el dado del stand: 1 cara que gana (trado + check) y 5 que pierden
     (una X y una estafa típica). Hojas A4 vertical, a tamaño real, para recortar por la línea gris.
     El lado de la cara se elige con ?lado=50 (mm): medir el dado y usar la cara 2-3 mm más chica
     que el lado. ?armable=60 dibuja en cambio un dado de papel para recortar, doblar y pegar.
     Se genera con: node EtMday/dados/generar.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 210mm 297mm; margin: 0; }
  :root { --azul: #2230C2; --medio: #4B35D6; --violeta: #7C3AED; --tinta: #0F1424; --naranjo: #FF6B4A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--tinta); background: #fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hoja { width: 210mm; height: 297mm; position: relative; overflow: hidden; break-after: page; padding: 12mm 10mm; }
  .hoja:last-child { break-after: auto; }
  .grilla { display: grid; gap: 6mm; justify-content: center; }
  .corte { outline: .2mm solid #9AA0B4; border-radius: 12%; }

  /* Cada cara mide L × L; todo lo de adentro escala con L (1em = L/10) */
  .cara { width: var(--L); height: var(--L); font-size: calc(var(--L) / 10); border-radius: 12%; position: relative; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .gana { background: linear-gradient(150deg, var(--azul) 0%, var(--medio) 55%, var(--violeta) 100%); color: #fff; }
  .gana::before { content: ""; position: absolute; width: 9em; height: 9em; border-radius: 50%; background: rgba(255,255,255,.1); top: -4.5em; right: -3.5em; }
  .gana .check { width: 3.6em; height: 3.6em; border-radius: 50%; background: #fff; color: var(--azul); display: flex; align-items: center; justify-content: center; position: relative;
                 box-shadow: 0 .25em .6em rgba(10,15,60,.35); }
  .gana .check svg { width: 2.3em; height: 2.3em; }
  .gana img { height: 1.55em; margin-top: .7em; position: relative; }
  .gana .txt { font-size: .82em; font-weight: 800; letter-spacing: .06em; margin-top: .35em; position: relative; }

  .pierde { background: #F3F3F9; border: .12em solid #E2E3EE; }
  .pierde .x { width: 4.4em; height: 4.4em; color: var(--naranjo); }
  .pierde .txt { font-size: .95em; font-weight: 800; line-height: 1.1; margin-top: .45em; padding: 0 .6em; }
  .pierde .sub { font-size: .6em; font-weight: 700; color: #6B7085; margin-top: .3em; text-transform: uppercase; letter-spacing: .08em; }

  .nota { position: absolute; left: 10mm; right: 10mm; bottom: 8mm; display: flex; justify-content: space-between; align-items: center; font-size: 3.2mm; color: #4A5068; }
  .regla { display: flex; align-items: center; gap: 2mm; }
  .regla i { display: block; width: 50mm; height: 2.4mm; border: .3mm solid var(--tinta); border-top: none; }

  /* Dado armable: cruz de 6 caras con pestañas para pegar */
  .armable { position: relative; margin: 0 auto; }
  .armable .pos { position: absolute; }
  .armable .cara { border-radius: 0; outline: .25mm solid #9AA0B4; }
  .armable .pierde { border: none; }
  .pestana { position: absolute; background: #E9EAF2; outline: .25mm dashed #9AA0B4; }
</style>
</head>
<body>
<div id="todo"></div>
<script>
  const q = new URLSearchParams(location.search);
  const L = Number(q.get("lado") || 50);           // mm
  const A = Number(q.get("armable") || 0);         // mm (0 = hojas de caras)
  const SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const SVG_X = '<svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const LOGO = "../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20blanco.svg";
  const ESTAFAS = [
    ["Comprobante falso", "estafa"],
    ["Te pago después", "estafa"],
    ["Link de pago falso", "estafa"],
    ["Pagaste por fuera", "estafa"],
    ["Te llegó un ladrillo", "estafa"],
  ];
  const gana = () => `<div class="cara gana"><span class="check">${SVG_CHECK}</span><img src="${LOGO}" alt="trado"><span class="txt">¡GANASTE!</span></div>`;
  const pierde = ([t, s]) => `<div class="cara pierde">${SVG_X}<span class="txt">${t}</span><span class="sub">${s}</span></div>`;
  const caras = () => [gana(), ...ESTAFAS.map(pierde)];
  const nota = (txt) => `<div class="nota"><span>${txt}</span><span class="regla"><i></i>debe medir 50 mm</span></div>`;
  const todo = document.getElementById("todo");

  if (A) {
    // Cruz: fila del medio con 4 caras; la que gana arriba de la 2.ª y una estafa abajo
    const pos = [[1, 0, gana()], [0, 1, pierde(ESTAFAS[0])], [1, 1, pierde(ESTAFAS[1])], [2, 1, pierde(ESTAFAS[2])], [3, 1, pierde(ESTAFAS[3])], [1, 2, pierde(ESTAFAS[4])]];
    const T = A * 0.18; // pestaña
    const pest = [
      // [x, y, ancho, alto] en mm, relativos a la cruz
      [0, A - T, A, T], [2 * A, A - T, A, T], [3 * A, A - T, A, T],
      [0, 2 * A, A, T], [2 * A, 2 * A, A, T], [3 * A, 2 * A, A, T],
      [4 * A, A, T, A],
    ];
    const W = 4 * A + T, H = 3 * A;
    todo.innerHTML = `<div class="hoja" style="width:297mm;height:210mm;padding:0;display:flex;align-items:center;justify-content:center">
      <div class="armable" style="width:${W}mm;height:${H}mm">
        ${pest.map(([x, y, w, h]) => `<div class="pestana" style="left:${x}mm;top:${y}mm;width:${w}mm;height:${h}mm"></div>`).join("")}
        ${pos.map(([c, f, html]) => `<div class="pos" style="left:${c * A}mm;top:${f * A}mm;--L:${A}mm">${html}</div>`).join("")}
      </div>
      ${nota(`Dado de papel de ${A / 10} cm · recortar por el borde, doblar por las líneas grises y pegar las pestañas · cartulina gruesa`)}
    </div>`;
    const st = document.createElement("style"); st.textContent = "@page { size: 297mm 210mm; margin: 0; }"; document.head.appendChild(st);
    document.documentElement.style.width = "297mm";
    document.body.style.width = "297mm";
  } else {
    const cols = Math.max(1, Math.floor((190 + 6) / (L + 6)));
    const filas = Math.max(1, Math.floor((265 + 6) / (L + 6)));
    const porHoja = cols * filas;
    // Hojas con juegos completos de 6 caras (si caben 12, van 2 dados)
    const juegos = Math.max(1, Math.floor(porHoja / 6));
    const lista = Array.from({ length: juegos }, caras).flat();
    const hojas = [];
    for (let i = 0; i < lista.length; i += porHoja) hojas.push(lista.slice(i, i + porHoja));
    todo.innerHTML = hojas.map((h, k) => `<div class="hoja" style="--L:${L}mm">
      <div class="grilla" style="grid-template-columns:repeat(${cols}, ${L}mm)">${h.map((c) => `<div class="corte">${c}</div>`).join("")}</div>
      ${nota(`Caras de ${L / 10} cm · imprimir al <b>100 % / tamaño real</b> · 1 cara gana, 5 pierden${hojas.length > 1 ? ` · hoja ${k + 1} de ${hojas.length}` : ""}`)}
    </div>`).join("");
  }
</script>
</body>
</html>
