<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda H · Comprobante</title>
<!-- Opción H: un comprobante de transferencia gigante que dice $0 "porque no transfiero primero";
     el QR va al pie como si fuera el código del comprobante. 28 × 36 cm, fondo transparente. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta); display: flex; justify-content: center; padding-top: 0.5cm; }
  .ticket { width: 21cm; height: 35cm; background: #fff; border: 0.25cm solid var(--tinta); border-radius: 0.6cm; position: relative; padding: 1.4cm 1.6cm; display: flex; flex-direction: column; }
  .ticket::after { content: ""; position: absolute; left: -0.25cm; right: -0.25cm; bottom: -0.9cm; height: 1cm;
                   background: radial-gradient(circle at 0.6cm 0, transparent 0.55cm, #fff 0.57cm) repeat-x; background-size: 1.2cm 1cm; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 1.5cm; }
  .ok { font-size: 0.75cm; font-weight: 800; color: #fff; background: var(--violeta); border-radius: 99cm; padding: 0.15cm 0.6cm; }
  .tit { margin-top: 1.1cm; font-size: 1.05cm; font-weight: 800; letter-spacing: .1cm; text-transform: uppercase; color: #6B7085; }
  .monto { font-size: 7cm; font-weight: 800; letter-spacing: -0.3cm; line-height: 1; margin-top: 0.2cm; color: var(--indigo); }
  .linea { border-top: 0.12cm dashed #B9BCCB; margin: 0.8cm 0; }
  .fila { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 0.78cm; padding: 0.22cm 0; }
  .fila b { font-weight: 700; }
  .motivo { font-size: 1.5cm; font-weight: 800; line-height: 1.02; letter-spacing: -0.05cm; text-transform: uppercase; }
  .motivo span { color: var(--violeta); }
  .qr { margin-top: auto; display: flex; align-items: center; gap: 0.8cm; }
  .qr img { width: 8.6cm; height: 8.6cm; display: block; }
  .qr p { font-size: 0.85cm; font-weight: 700; line-height: 1.3; }
  .qr p b { display: block; font-size: 1.15cm; font-weight: 800; color: var(--indigo); }
</style>
</head>
<body>
  <div class="ticket">
    <div class="top"><img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado"><span class="ok">COMPROBANTE</span></div>
    <p class="tit">Monto transferido</p>
    <p class="monto">$0</p>
    <div class="fila"><span>Destino</span><b>un desconocido</b></div>
    <div class="fila"><span>Estado</span><b>rechazada por mí</b></div>
    <div class="fila"><span>Hora</span><b>23:47</b></div>
    <div class="linea"></div>
    <p class="motivo">Motivo: <span>yo no transfiero primero.</span></p>
    <div class="qr">
      <img src="qr-polera.svg" alt="">
      <p><b>Escanéame</b>La plata queda retenida hasta que recibes lo tuyo.</p>
    </div>
  </div>
</body>
</html>
