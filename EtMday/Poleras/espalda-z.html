<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda Z · PARE</title>
<!-- Espalda Z (elegida para EtMday): señal de PARE en índigo antes de transferir. Letra grande
     para leerse de lejos y contenido centrado. Área 28 × 36 cm, fondo transparente.
     Generar: node EtMday/Poleras/generar.mjs espalda-z -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta);
         display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 0.4cm; text-align: center; }

  .antes { font-size: 2cm; font-weight: 800; line-height: 1.08; letter-spacing: -0.06cm; }
  .antes span { color: var(--indigo); white-space: nowrap; }
  .senal { display: flex; flex-direction: column; align-items: center; }
  .senal svg { display: block; width: 19cm; }
  .poste { width: 1.5cm; height: 1.6cm; background: #8A8FA3; margin-top: -0.2cm; border-radius: 0 0 0.3cm 0.3cm; }

  .bajada { font-size: 1.5cm; font-weight: 800; line-height: 1.18; letter-spacing: -0.03cm; }
  .bajada b { color: var(--indigo); }
  .firma { display: flex; align-items: center; gap: 0.8cm; }
  .firma img { height: 2.7cm; }
  .firma span { font-size: 1.6cm; font-weight: 800; border-left: 0.15cm solid var(--tinta); padding-left: 0.8cm; }
</style>
</head>
<body>
  <p class="antes">¿Te dijeron<br><span>“transfiéreme primero”?</span></p>

  <div class="senal">
    <svg viewBox="0 0 220 220" aria-hidden="true">
      <polygon points="64.4,0 155.6,0 220,64.4 220,155.6 155.6,220 64.4,220 0,155.6 0,64.4" fill="#131924"/>
      <polygon points="67.7,8 152.3,8 212,67.7 212,152.3 152.3,212 67.7,212 8,152.3 8,67.7" fill="#fff"/>
      <polygon points="71,16 149,16 204,71 204,149 149,204 71,204 16,149 16,71" fill="#1F25C1"/>
      <text x="110" y="128" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="72" letter-spacing="-2" fill="#fff">PARE</text>
      <text x="110" y="160" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="16.5" letter-spacing="0.3" fill="#fff">NO TRANSFIERAS</text>
    </svg>
    <div class="poste"></div>
  </div>

  <p class="bajada">Con trado la plata queda retenida<br><b>hasta que recibes lo tuyo.</b></p>

  <div class="firma">
    <img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
    <span>trado.cl</span>
  </div>
</body>
</html>
