<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda Z · PARE</title>
<!-- Espalda Z: señal de PARE en índigo antes de transferir. Área 28 × 36 cm, fondo
     transparente. Generar: node EtMday/Poleras/generar.mjs espalda-z -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta);
         display: flex; flex-direction: column; align-items: center; padding: 1cm 1cm 0.8cm; }

  .antes { font-size: 1.32cm; font-weight: 800; text-align: center; line-height: 1.1; letter-spacing: -0.05cm; }
  .antes span { color: var(--violeta); }
  svg { display: block; width: 19.5cm; margin-top: 0.8cm; }
  .poste { width: 1.4cm; height: 2.2cm; background: #8A8FA3; margin-top: -0.2cm; border-radius: 0 0 0.3cm 0.3cm; }

  .bajada { margin-top: 0.9cm; font-size: 1.15cm; font-weight: 700; text-align: center; line-height: 1.3; }
  .bajada b { color: var(--indigo); }
  .firma { margin-top: auto; display: flex; align-items: center; gap: 0.7cm; }
  .firma img { height: 2.1cm; }
  .firma span { font-size: 1.15cm; font-weight: 800; border-left: 0.12cm solid var(--tinta); padding-left: 0.7cm; }
</style>
</head>
<body>
  <p class="antes">¿Te dijeron “transfiéreme primero”?<br><span>Hazle caso a la señal.</span></p>

  <svg viewBox="0 0 220 220" aria-hidden="true">
    <polygon points="64.4,0 155.6,0 220,64.4 220,155.6 155.6,220 64.4,220 0,155.6 0,64.4" fill="#131924"/>
    <polygon points="67.7,8 152.3,8 212,67.7 212,152.3 152.3,212 67.7,212 8,152.3 8,67.7" fill="#fff"/>
    <polygon points="71,16 149,16 204,71 204,149 149,204 71,204 16,149 16,71" fill="#1F25C1"/>
    <text x="110" y="132" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="66" letter-spacing="-2" fill="#fff">PARE</text>
    <text x="110" y="166" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="15" letter-spacing="1" fill="#fff">NO TRANSFIERAS</text>
  </svg>
  <div class="poste"></div>

  <p class="bajada">Con <b>trado</b> la plata queda retenida<br><b>hasta que recibes lo tuyo.</b></p>

  <div class="firma">
    <img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
    <span>trado.cl</span>
  </div>
</body>
</html>
