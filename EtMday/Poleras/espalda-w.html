<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda W · Cuidados de tu plata</title>
<!-- Opción W (Cuidados de tu plata): estilo ropa urbana, distinto a las anteriores. QR a https://trado.cl
     (qr-polera.svg). 28 × 36 cm, fondo transparente. Generar: node EtMday/Poleras/generar.mjs espalda-w -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Anton&family=Bungee&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --medio: #4B35D6; --violeta: #1F25C1; /* antes morado: el principal ahora es índigo, como la opción C */ --tinta: #131924; --amarillo: #FCD34D; --lila: #C4B5FD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta); position: relative; }

  .et { position: absolute; left: 2cm; top: 0.6cm; width: 24cm; height: 34.6cm; background: #fff; border: 0.3cm solid var(--tinta); border-radius: 0.8cm;
        padding: 1.3cm 1.5cm; display: flex; flex-direction: column; }
  .et::before { content: ""; position: absolute; top: -0.3cm; left: 50%; transform: translateX(-50%); width: 6cm; height: 1.2cm; background: var(--violeta); border-radius: 0 0 0.4cm 0.4cm; }
  .t { font-family: "Anton", sans-serif; font-size: 3cm; line-height: .95; text-transform: uppercase; letter-spacing: .03cm; }
  .t span { color: var(--violeta); }
  .comp { font-size: 0.9cm; font-weight: 800; margin-top: 0.4cm; letter-spacing: .05cm; }
  .iconos { display: flex; gap: 0.6cm; margin: 0.7cm 0 0.5cm; }
  .iconos i { width: 2.3cm; height: 2.3cm; border: 0.18cm solid var(--tinta); border-radius: 0.4cm; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: 1.3cm; position: relative; overflow: hidden; }
  .iconos i::after { content: ""; position: absolute; width: 3.2cm; height: 0.2cm; background: var(--violeta); transform: rotate(-45deg); }
  .iconos i.ok::after { display: none; }
  .iconos i.ok { background: var(--violeta); color: #fff; border-color: var(--violeta); }
  ul { list-style: none; font-size: 1.05cm; font-weight: 800; line-height: 1.25; }
  ul li { padding: 0.2cm 0; border-bottom: 0.06cm dashed #9AA0B4; }
  ul li b { color: var(--violeta); }
  .pie { margin-top: auto; display: flex; align-items: center; gap: 0.8cm; }
  .pie img.qr { width: 9.4cm; height: 9.4cm; display: block; }
  .pie div { font-size: 0.9cm; font-weight: 800; line-height: 1.3; }
  .pie div img { height: 2.2cm; display: block; margin-bottom: 0.3cm; }
</style>
</head>
<body>
<div class="et">
  <p class="t">Cuidados de<br><span>tu plata</span></p>
  <p class="comp">COMPOSICIÓN: lo que te costó ganarla</p>
  <div class="iconos"><i>$</i><i>✉</i><i>⇄</i><i class="ok">✓</i></div>
  <ul>
    <li>No transferir primero a desconocidos</li>
    <li>No confiar en comprobantes por WhatsApp</li>
    <li>No pagar por fuera del método seguro</li>
    <li><b>Lavar solo con trado</b></li>
  </ul>
  <div class="pie"><img class="qr" src="qr-polera.svg" alt=""><div><img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">Escanea y paga con la plata protegida</div></div>
</div>
</body>
</html>
