<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda B · Escanéame la espalda</title>
<!-- Gráfica de la espalda, opción B (elegida para EtMday). Área de estampado 28 × 36 cm, fondo
     transparente. Letra grande para leerse de lejos y contenido centrado en el área.
     El QR lleva a https://trado.cl (qr-polera.svg) y mide 12 cm.
     Generar: node EtMday/Poleras/generar.mjs espalda-b -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta);
         display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 0.4cm 0.4cm; text-align: center; }

  .pre { font-size: 1.62cm; font-weight: 800; line-height: 1.1; letter-spacing: -0.04cm; white-space: nowrap; }
  .pre s { text-decoration-thickness: 0.18cm; text-decoration-color: var(--violeta); }

  h1 { font-weight: 800; text-transform: uppercase; line-height: 0.86; letter-spacing: -0.13cm; white-space: nowrap; }
  h1 span { display: block; }
  .l1 { font-size: 4.3cm; }
  .l2 { font-size: 3.85cm; color: var(--indigo); }

  .qr { position: relative; padding: 0.8cm; border: 0.35cm solid var(--tinta); border-radius: 1cm; }
  .qr img { display: block; width: 12cm; height: 12cm; }
  .flecha { position: absolute; left: -6.4cm; top: 0.6cm; font-size: 1.35cm; font-weight: 800; color: var(--violeta);
            transform: rotate(-10deg); line-height: 1.05; text-align: right; }
  .flecha svg { display: block; width: 3.6cm; margin: 0.25cm 0 0 auto; }

  .bajada { font-size: 1.42cm; font-weight: 800; line-height: 1.18; letter-spacing: -0.03cm; }
  .bajada b { color: var(--indigo); }

  .firma { display: flex; align-items: center; gap: 0.8cm; }
  .firma img { height: 2.7cm; }
  .firma span { font-size: 1.6cm; font-weight: 800; border-left: 0.15cm solid var(--tinta); padding-left: 0.8cm; }
</style>
</head>
<body>
  <p class="pre">¿Te pidieron <s>transferir primero</s>?</p>

  <h1><span class="l1">Escanéame</span><span class="l2">la espalda.</span></h1>

  <div class="qr">
    <img src="qr-polera.svg" alt="">
    <div class="flecha">sí, aquí<br>mismo
      <svg viewBox="0 0 110 70"><path d="M6 8 C 40 10, 70 30, 96 58" fill="none" stroke="#7B46D8" stroke-width="9" stroke-linecap="round"/><path d="M70 58 L98 60 L94 32" fill="none" stroke="#7B46D8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <p class="bajada">La plata queda retenida<br><b>hasta que recibes lo tuyo.</b></p>

  <div class="firma">
    <img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
    <span>trado.cl</span>
  </div>
</body>
</html>
