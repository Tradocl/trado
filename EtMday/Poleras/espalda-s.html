<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda S · Miedo a que te estafen</title>
<!-- Opción S: bloque de color lleno, "trado" grande, QR grande a https://trado.cl en tarjeta
     blanca y una frase directa. 28 × 36 cm, fondo transparente (el bloque mide 26 × 34,4 cm). -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --medio: #4B35D6; --violeta: #7B46D8; --tinta: #131924; --amarillo: #FCD34D; --lila: #C4B5FD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; display: flex; justify-content: center; padding-top: 0.8cm; }
  .b { position: relative; overflow: hidden; width: 26cm; height: 34.4cm; border-radius: 1.6cm; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: 1.3cm 1.3cm 1.2cm; }
  .b > * { position: relative; z-index: 1; }
  .luz { position: absolute !important; z-index: 0 !important; border-radius: 50%; }
  .logo { display: block; margin: 0 auto; }
  .qr { background: #fff; border-radius: 1.1cm; padding: 0.8cm; box-shadow: 0 0.5cm 1.2cm rgba(10,10,40,.35); }
  .qr img { display: block; width: 10.4cm; height: 10.4cm; }
  .h { font-weight: 800; line-height: 1.05; letter-spacing: -0.07cm; }
  .s { font-size: 1cm; font-weight: 700; line-height: 1.3; opacity: .95; }
  .esc { display: inline-block; margin-top: 0.5cm; font-size: 0.9cm; font-weight: 800; letter-spacing: 0.1cm; text-transform: uppercase;
          background: rgba(255,255,255,.18); border-radius: 99cm; padding: 0.2cm 0.8cm; }
  .b { background: radial-gradient(circle at 80% 10%, #3B2A9E 0%, var(--tinta) 55%); }
  .luz.a { width: 16cm; height: 16cm; bottom: -6cm; left: -6cm; background: radial-gradient(circle, rgba(123,70,216,.55), transparent 70%); }
  .h1 { font-size: 2.2cm; }
  .h2 { font-size: 4.2cm; margin-top: 0.2cm; background: linear-gradient(100deg, var(--lila), #F0ABFC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .qr { border: 0.3cm solid var(--violeta); }
</style>
</head>
<body>
  <div class="b">
    <div class="luz a"></div>
    <div><p class="h h1">¿Miedo a que<br>te estafen?</p><p class="h h2">Usa Trado.</p></div>
    <div><div class="qr"><img src="qr-polera.svg" alt=""></div><span class="esc">Escanéame</span></div>
    <div><p class="s">Compra y vende por redes con tu plata protegida.</p><div style="margin-top:0.7cm"><img class="logo" src="trado-morado.svg" alt="trado" style="height:3.6cm"></div></div>
  </div>
</body>
</html>
