<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda K · Se busca</title>
<!-- Opción K: afiche de "SE BUSCA" al que dijo "transfiéreme primero"; el QR ocupa el lugar de la
     foto y la recompensa es comprar tranquilo. 28 × 36 cm, fondo transparente. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta); display: flex; justify-content: center; padding-top: 0.4cm; }
  .afiche { width: 23cm; height: 35.2cm; border: 0.35cm solid var(--tinta); outline: 0.12cm solid var(--tinta); outline-offset: 0.35cm; margin-top: 0.4cm;
            display: flex; flex-direction: column; align-items: center; text-align: center; padding: 1.2cm 1.4cm; }
  .se { font-size: 5cm; font-weight: 800; letter-spacing: -0.15cm; line-height: .9; text-transform: uppercase; }
  .por { font-size: 1.05cm; font-weight: 700; margin-top: 0.6cm; line-height: 1.25; }
  .por b { display: block; font-size: 1.6cm; font-weight: 800; color: var(--violeta); line-height: 1.1; }
  .foto { margin-top: 0.9cm; border: 0.25cm solid var(--tinta); padding: 0.6cm; background: #fff; }
  .foto img { display: block; width: 10cm; height: 10cm; }
  .rec { margin-top: 0.9cm; font-size: 0.95cm; font-weight: 800; text-transform: uppercase; letter-spacing: .1cm; color: #6B7085; }
  .rec b { display: block; font-size: 1.5cm; color: var(--indigo); letter-spacing: -0.03cm; margin-top: 0.15cm; text-transform: none; }
  .firma { margin-top: auto; }
  .firma img { height: 1.7cm; display: block; }
</style>
</head>
<body>
  <div class="afiche">
    <p class="se">Se busca</p>
    <p class="por">al que dijo<b>“transfiéreme primero”</b></p>
    <div class="foto"><img src="qr-polera.svg" alt=""></div>
    <p class="rec">Recompensa<b>comprar tranquilo</b></p>
    <div class="firma"><img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado"></div>
  </div>
</body>
</html>
