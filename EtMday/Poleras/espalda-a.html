<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda A · Yo no transfiero primero</title>
<!-- Gráfica de la espalda, opción A (elegida para EtMday, letra grande para leerse de lejos). Área de estampado 28 × 36 cm, fondo transparente.
     Colores planos salvo el logo, que va con su degradado (logo principal según la guía).
     Generar PNG a 300 dpi: node EtMday/Poleras/generar.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; --gris: #ECEDF3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta);
         display: flex; flex-direction: column; align-items: center; padding: 0.4cm 0.4cm; justify-content: space-evenly; }

  .chat { position: relative; align-self: flex-start; margin-left: 0.6cm; background: var(--gris);
          border-radius: 1.2cm 1.2cm 1.2cm 0.3cm; padding: 0.8cm 1.1cm; font-size: 1.42cm; font-weight: 800;
          line-height: 1.15; width: 16.5cm; }
  .chat .hora { display: block; text-align: right; font-size: 0.75cm; font-weight: 700; color: #8A8FA3; margin-top: 0.2cm; }
  .sello { position: absolute; right: -9.6cm; top: 1.4cm; transform: rotate(-12deg);
           border: 0.32cm solid var(--violeta); color: var(--violeta); border-radius: 0.5cm;
           padding: 0.1cm 0.7cm 0.2cm; font-size: 2.4cm; font-weight: 800; letter-spacing: -0.04cm; white-space: nowrap; line-height: 1; }

  h1 { text-align: center; font-weight: 800; text-transform: uppercase; line-height: 0.86; letter-spacing: -0.12cm; }
  h1 span { display: block; }
  .l1 { font-size: 5.2cm; }
  .l2 { font-size: 4.25cm; }
  .l3 { font-size: 4.95cm; color: var(--indigo); }

  .bajada { font-size: 1.42cm; font-weight: 800; text-align: center; line-height: 1.18; letter-spacing: -0.03cm; }
  .bajada b { color: var(--indigo); }

  .firma { display: flex; align-items: center; gap: 0.8cm; }
  .firma img { height: 2.7cm; }
  .firma span { font-size: 1.6cm; font-weight: 800; border-left: 0.15cm solid var(--tinta); padding-left: 0.8cm; }
</style>
</head>
<body>
  <div class="chat">Transfiéreme primero y te lo mando al tiro<span class="hora">23:47 ✓✓</span>
    <div class="sello">NI AHÍ.</div>
  </div>

  <h1><span class="l1">Yo no</span><span class="l2">transfiero</span><span class="l3">primero.</span></h1>

  <p class="bajada">Con trado la plata queda retenida<br><b>hasta que recibes lo tuyo.</b></p>

  <div class="firma">
    <img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
    <span>trado.cl</span>
  </div>
</body>
</html>
