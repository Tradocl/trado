<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polera espalda D · ¿Quién paga primero?</title>
<!-- Gráfica de la espalda, opción D: la discusión de siempre entre comprador y vendedor
     ("Nadie quiere arriesgarse primero" / "Trado se pone al medio", del feed de Instagram).
     Área 28 × 36 cm, fondo transparente. Generar: node EtMday/Poleras/generar.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #1F25C1; --violeta: #7B46D8; --tinta: #131924; --gris: #ECEDF3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 28cm; height: 36cm; font-family: "Plus Jakarta Sans", sans-serif; color: var(--tinta);
         display: flex; flex-direction: column; align-items: center; padding: 1.2cm 1.2cm 0.8cm; }

  h1 { text-align: center; font-weight: 800; text-transform: uppercase; line-height: 0.88; letter-spacing: -0.1cm; }
  h1 span { display: block; }
  .l1 { font-size: 3.7cm; white-space: nowrap; }
  .l2 { font-size: 4.6cm; color: var(--indigo); }

  .chat { width: 100%; margin-top: 0.9cm; display: flex; flex-direction: column; gap: 0.35cm; }
  .m { max-width: 18cm; padding: 0.5cm 0.85cm; font-size: 1.05cm; font-weight: 700; line-height: 1.2; }
  .izq { align-self: flex-start; background: var(--gris); border-radius: 1cm 1cm 1cm 0.25cm; }
  .der { align-self: flex-end; background: var(--indigo); color: #fff; border-radius: 1cm 1cm 0.25cm 1cm; }
  .quien { display: block; font-size: 0.6cm; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06cm; opacity: 0.6; margin-bottom: 0.1cm; }

  .remate { margin-top: 0.8cm; text-align: center; }
  .remate b { display: block; font-size: 2.7cm; font-weight: 800; letter-spacing: -0.1cm; line-height: 1; color: var(--violeta); text-transform: uppercase; }
  .remate p { margin-top: 0.5cm; font-size: 1cm; font-weight: 700; line-height: 1.3; }
  .remate p strong { color: var(--indigo); }

  .firma { margin-top: auto; display: flex; align-items: center; gap: 0.7cm; }
  .firma img { height: 2.1cm; }
  .firma span { font-size: 1.15cm; font-weight: 800; border-left: 0.12cm solid var(--tinta); padding-left: 0.7cm; }
</style>
</head>
<body>
  <h1><span class="l1">¿Quién paga</span><span class="l2">primero?</span></h1>

  <div class="chat">
    <div class="m izq"><span class="quien">Vende</span>Transfiéreme y te lo mando</div>
    <div class="m der"><span class="quien">Compra</span>Mándalo tú primero po</div>
    <div class="m izq"><span class="quien">Vende</span>¿Y si no me pagas?</div>
    <div class="m der"><span class="quien">Compra</span>¿Y si no me llega?</div>
  </div>

  <div class="remate">
    <b>Ninguno.</b>
    <p><strong>trado se pone al medio:</strong> la plata queda<br>retenida hasta que recibes lo tuyo.</p>
  </div>

  <div class="firma">
    <img src="../../Instagram/4%20Logos/1%20Logo%20trado/SVG%20(vectorial)/trado%20degradado.svg" alt="trado">
    <span>trado.cl</span>
  </div>
</body>
</html>
