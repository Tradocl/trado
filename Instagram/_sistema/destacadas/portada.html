<!doctype html>
<!-- Portada de historia destacada, 1080x1920. El ícono va con ?i=nombre.
     Instagram recorta un círculo al centro: todo lo importante vive ahí. -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1225A8 0%, #3D4BCE 50%, #7B46D8 100%);
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 400px; height: 400px; }
</style>
</head>
<body>
<svg id="icono" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round"></svg>
<script>
  // Íconos de Lucide, los mismos que usa la app.
  const ICONOS = {
    custodia: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    precios: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
    senales: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    nosotros: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    dudas: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  };
  const i = new URLSearchParams(location.search).get("i");
  document.getElementById("icono").innerHTML = ICONOS[i] ?? "";
</script>
</body>
</html>
