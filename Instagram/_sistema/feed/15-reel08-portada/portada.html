<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../base.css">
<!-- Portada del reel 08 "Desde donde quieras" (el primero contigo a cámara). Oscura: sale como post 15
     (impares de color, alternando azul y oscuro; el 13 fue azul).
     Lienzo 1080x1920; la grilla muestra el centro 3:4 (y 240 a 1680).
     tu.png es un cuadro del recorte de la toma "trado" (remotion/public/material/desde-donde-quieras/generado/trado.webm, 0,9 s).
     La publicación es la misma del gancho del reel: diseño nuestro, sin la interfaz de ninguna app.
     Render: node render.mjs feed/15-reel08-portada (desde _sistema). -->
<style>
  html, body { height: 1920px; }
  .slide { height: 1920px; padding: 300px 88px 300px; }
  .grande { margin-top: 40px; font-size: 128px; font-weight: 800; letter-spacing: -5.5px; line-height: .95; }
  .sub { margin-top: 34px; font-size: 44px; font-weight: 700; color: #C9CAD6; }
  .sub b { color: #fff; }
  .tu { position: absolute; right: -40px; bottom: 0; width: 860px; }
  .post { position: absolute; left: 64px; top: 1290px; width: 520px; background: #fff; border-radius: 40px; padding: 26px;
          display: flex; gap: 24px; align-items: center; transform: rotate(-4deg); box-shadow: 0 40px 80px -20px rgba(0,0,0,.6); color: var(--texto); }
  .post .foto { width: 140px; height: 140px; border-radius: 28px; background: #DDF5EA; display: grid; place-items: center; font-size: 84px; flex: none; }
  .post .precio { font-size: 58px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .post .que { margin-top: 8px; font-size: 26px; font-weight: 600; color: #3B4150; }
  .post .lugar { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 999px; background: #FF6B4A; color: #fff; font-size: 28px; font-weight: 800; }
  .km { position: absolute; left: 380px; top: 1210px; padding: 12px 26px; border-radius: 999px; background: #FF6B4A; color: #fff;
        font-size: 36px; font-weight: 800; transform: rotate(5deg); box-shadow: 0 20px 40px -10px rgba(0,0,0,.5); }
  .ver { position: absolute; left: 88px; top: 1592px; display: flex; align-items: center; gap: 24px; font-size: 34px; font-weight: 700; color: #fff; }
  .play { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .play svg { width: 30px; height: 30px; fill: #1F25C1; margin-left: 5px; }
</style></head>
<body><div class="slide fondo-oscuro">
  <div class="cabecera"><span class="logo">trado</span><span class="etiqueta neutra">Comprar a distancia</span></div>
  <div class="grande">¿Y si el vendedor está en <span class="marca">Arica?</span></div>
  <div class="sub">Compra y vende <b>desde donde quieras.</b></div>
  <img class="tu" src="tu.png">
  <div class="post">
    <div class="foto">🚲</div>
    <div><div class="precio">$180.000</div><div class="que">Bicicleta aro 29, como nueva</div><span class="lugar">📍 Arica</span></div>
  </div>
  <div class="km">≈ 2.000 km</div>
  <div class="ver"><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>Mira cómo</div>
</div></body></html>
