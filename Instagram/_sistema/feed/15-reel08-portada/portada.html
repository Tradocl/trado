<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../base.css">
<!-- Portada del reel 08 "Venta en el metro". Oscura: sale como post 15
     (impares de color, alternando azul y oscuro; el 13 fue azul).
     Lienzo 1080x1920; la grilla muestra el centro 3:4 (y 240 a 1680).
     noticia.png sale de reels/15-noticia-metro (sV): tiene imágenes de un noticiero,
     así que ni noticia.png ni portada.png van al repo (ver .gitignore). -->
<style>
  html, body { height: 1920px; }
  .slide { height: 1920px; padding: 300px 88px 300px; }
  .grande { margin-top: 24px; font-size: 128px; font-weight: 800; letter-spacing: -6px; line-height: .95; }
  .sub { margin-top: 34px; font-size: 44px; font-weight: 700; color: #C9CAD6; }
  .sub b { color: #FF6B4A; }
  .noticia { display: block; width: 1080px; margin: 28px -88px 0; }
  .ver { display: flex; align-items: center; gap: 24px; font-size: 34px; font-weight: 700; color: #fff; }
  .play { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .play svg { width: 30px; height: 30px; fill: #1F25C1; margin-left: 5px; }
</style></head>
<body><div class="slide fondo-oscuro">
  <div class="cabecera"><span class="logo">trado</span><span class="etiqueta neutra">Noticia · jul 2025</span></div>
  <div class="grande">¿Vendes en el <span class="marca">metro?</span></div>
  <div class="sub">Se juntaron a vender un celular. <b>No terminó bien.</b></div>
  <img class="noticia" src="noticia.png">
  <div class="relleno"></div>
  <div class="ver"><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>Mira qué pasó</div>
</div></body></html>
