<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../base.css">
<!-- Versión sin compromiso (2026-09-28): sin tramos, sin umbrales ni ejemplos que
     puedan cambiar. "Hasta 5%" es cierto para la tarjeta; el mínimo por operación
     (hoy $1.000, calculateFee) se menciona sin número porque en montos chicos el
     porcentaje real supera el 5%. La cifra exacta se ve en la app antes de crear la sala.
     Fondo gris a propósito: arma el patrón del feed. Lo llamativo va en la boleta:
     inclinada, con timbre "Solo pagas si se vende" (mismo lenguaje que el sello FALSO
     del post 07) y la transferencia destacada con flecha. -->
<style>
  .escena { position: relative; margin-top: 48px; }
  .boleta {
    position: relative; background: #fff; color: var(--texto);
    padding: 40px 46px 60px; border-radius: 20px 20px 0 0;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 4px rgba(19,25,36,.05), 0 50px 90px -30px rgba(31,37,193,.45);
    -webkit-mask: radial-gradient(circle 14px at 50% 100%, transparent 98%, #000) center bottom / 40px 100% round no-repeat;
  }
  .b-cab { text-align: center; padding-bottom: 22px; border-bottom: 3px dashed #D6D8E6; }
  .b-cab .logo { font-size: 48px; }
  .b-cab .chico { color: var(--gris); letter-spacing: 3px; text-transform: uppercase; font-size: 21px; margin-top: 4px; }
  .linea { display: flex; justify-content: space-between; align-items: center; font-size: 32px; margin-top: 24px; }
  .linea span:first-child { color: #3B4150; }
  .linea b { font-weight: 800; }
  .seccion { margin-top: 30px; font-size: 21px; font-weight: 700; letter-spacing: 2.5px; color: var(--gris); text-transform: uppercase; }
  .baja {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ECEDFB; color: var(--indigo); padding: 6px 18px 6px 12px; border-radius: 999px;
  }
  .baja svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .total { margin-top: 30px; padding-top: 22px; border-top: 3px dashed #D6D8E6; display: flex; justify-content: space-between; align-items: baseline; }
  .total span { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  .total b { font-size: 52px; font-weight: 800; color: var(--verde); letter-spacing: -1.5px; }

  /* Timbre de goma: borde doble y tinta verde, estampado sobre la boleta. */
  .timbre {
    position: absolute; right: 18px; bottom: -118px; transform: rotate(-9deg);
    border: 6px solid var(--verde); outline: 3px solid var(--verde); outline-offset: 6px;
    color: var(--verde); border-radius: 18px; padding: 12px 26px 10px;
    text-align: center; line-height: 1.02; background: rgba(255,255,255,.9);
    font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 12px 30px -14px rgba(19,25,36,.35);
  }
  .timbre .t1 { font-size: 26px; letter-spacing: 6px; }
  .timbre .t2 { font-size: 54px; }
</style></head>
<body><div class="slide fondo-gris">
  <div class="cabecera"><span class="logo">trado</span><span class="etiqueta">Sin letra chica</span></div>

  <div class="titulo" style="margin-top:48px;font-size:78px">¿Cuánto cuesta <span class="marca">Trado?</span></div>

  <div class="escena">
    <div class="boleta" style="transform: rotate(-1.8deg)">
      <div class="b-cab"><div class="logo">trado</div><div class="chico">Boleta de precios</div></div>

      <div class="linea"><span>Cuenta y mensualidad</span><b>$0</b></div>

      <div class="seccion">Comisión por venta</div>
      <div class="linea"><span>Con tarjeta</span><b>hasta 5%</b></div>
      <div class="linea"><span>Con transferencia</span>
        <b class="baja"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>aún menos</b>
      </div>
      <div class="linea"><span>Si la venta se cancela</span><b style="color:var(--verde)">$0</b></div>

      <div class="total"><span>Sorpresas al final</span><b>$0</b></div>
    </div>

    <div class="timbre"><div class="t1">Solo pagas</div><div class="t2">si se vende</div></div>
  </div>

  <div class="relleno"></div>
  <div class="pie"><span>Ves la comisión exacta antes de pagar · mínimo por operación</span><span>trado.cl</span></div>
</div></body></html>
