<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../base.css">
<!-- Portada del reel "Transfiéreme primero" (post 10, blanco según la grilla en X).
     Lienzo 1080x1920; la grilla muestra solo el centro 3:4 (y 240 a 1680), así que todo vive ahí. -->
<style>
  html, body { height: 1920px; }
  .slide { height: 1920px; padding: 300px 88px 300px; }
  .alerta { background: rgba(239,67,67,.10) !important; color: var(--rojo) !important; }
  .alerta svg { width: 22px; height: 22px; fill: var(--rojo); }
  .cita { margin-top: 64px; padding: 48px 52px; border-radius: 36px; }
  .cita .comillas { width: 64px; height: 50px; fill: var(--indigo); display: block; margin-bottom: 26px; }
  .cita .texto { font-size: 62px; font-weight: 800; letter-spacing: -2.4px; line-height: 1.08; text-wrap: balance; }
  .cita .quien { margin-top: 26px; font-size: 26px; font-weight: 500; color: var(--gris); }
  .pregunta { margin-top: 110px; font-size: 150px; font-weight: 800; letter-spacing: -6.5px; line-height: .95; }
  .ver { display: flex; align-items: center; gap: 24px; font-size: 32px; font-weight: 700; color: var(--indigo); }
  .play { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #1F25C1, #7B46D8); display: grid; place-items: center; box-shadow: 0 18px 40px -14px rgba(31,37,193,.6); }
  .play svg { width: 30px; height: 30px; fill: #fff; margin-left: 5px; }
</style></head>
<body><div class="slide fondo-gris">
  <div class="cabecera"><span class="logo">trado</span></div>
  <div class="antetitulo" style="margin-top:72px"><span class="etiqueta alerta"><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zM8 4h11l-2.5 4.5L19 13H8z"/></svg>Señal de alerta</span></div>

  <div class="tarjeta cita giro-izq">
    <svg class="comillas" viewBox="0 0 64 50"><path d="M0 50V30C0 13 8 3 24 0l3 7C18 10 14 16 14 24h12v26zM37 50V30C37 13 45 3 61 0l3 7c-9 3-13 9-13 17h12v26z"/></svg>
    <div class="texto">Transfiéreme primero y te lo mando altiro.</div>
    <div class="quien">Vendedor que no conoces · hace 2 min</div>
  </div>

  <div class="pregunta">¿Y si nunca <span class="marca">llega?</span></div>

  <div class="relleno"></div>
  <div class="ver"><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>Mira cómo evitarlo</div>
</div></body></html>
