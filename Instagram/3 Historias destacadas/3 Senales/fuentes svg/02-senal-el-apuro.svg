<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bubble-shadow-h1" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect id="background" width="1080" height="1920" fill="#FFFFFF"/>

  <g id="header-safe-zone">
    <text x="60" y="320" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="-1.5" fill="#1F25C1" id="logo">trado</text>
  </g>

  <g id="pill-categoria">
    <rect x="60" y="380" width="240" height="50" rx="25" fill="#EF4343" id="pill-bg"/>
    <text x="180" y="412" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" id="pill-text">EL APURO</text>
  </g>

  <g id="titulo-senal">
    <text x="60" y="510" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="#131924" id="titulo-1">"Decide ahora</text>
    <text x="60" y="580" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="#131924" id="titulo-2">o lo pierdes."</text>
  </g>

  <g id="bubble-estafador-1" filter="url(#bubble-shadow-h1)">
    <rect x="60" y="680" width="820" height="195" rx="20" fill="#F5F5FA" stroke="#E6E6EB" stroke-width="1" id="b1-bg"/>
    <text x="86" y="720" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#6C6C78" id="b1-label">Vendedor</text>
    <text x="86" y="770" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="b1-line-1">iPhone 15 Pro Max nuevo, sellado,</text>
    <text x="86" y="810" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="b1-line-2">con boleta. Lo dejo en</text>
    <text x="86" y="855" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="34" font-weight="700" fill="#EF4343" id="b1-line-3">$250.000</text>
  </g>

  <g id="bubble-tu" filter="url(#bubble-shadow-h1)">
    <rect x="380" y="900" width="640" height="110" rx="20" fill="#DCF8C6" stroke="#C5E4AC" stroke-width="1" id="bt-bg"/>
    <text x="406" y="940" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#5A7A4A" id="bt-label">Tú</text>
    <text x="406" y="985" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="bt-line">¿Mañana puedo verlo?</text>
  </g>

  <g id="bubble-estafador-2" filter="url(#bubble-shadow-h1)">
    <rect x="60" y="1040" width="900" height="280" rx="20" fill="#F5F5FA" stroke="#E6E6EB" stroke-width="1" id="b2-bg"/>
    <text x="86" y="1080" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#6C6C78" id="b2-label">Vendedor</text>
    <text x="86" y="1130" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="b2-line-1">Tengo otra persona interesada que</text>
    <text x="86" y="1170" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="b2-line-2">viene en una hora. Si transfieres</text>
    <text x="86" y="1215" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" font-weight="700" fill="#EF4343" id="b2-line-3">$30.000 de garantía</text>
    <text x="86" y="1260" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="30" fill="#131924" id="b2-line-4">te lo aseguro ahora</text>
  </g>

  <g id="regla-card">
    <rect x="60" y="1400" width="960" height="180" rx="24" fill="#FEEAEA" id="regla-bg"/>
    <polygon points="105,1445 88,1480 122,1480" fill="#EF4343" id="alert-triangle"/>
    <text x="105" y="1473" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" id="alert-excl">!</text>
    <text x="140" y="1473" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#EF4343" id="regla-label">REGLA DE ORO</text>
    <text x="90" y="1525" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="32" font-weight="700" fill="#131924" id="regla-line-1">Un trato legítimo soporta</text>
    <text x="90" y="1565" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="32" font-weight="700" fill="#131924" id="regla-line-2">24 horas de revisión.</text>
  </g>

  <text x="540" y="1700" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#6C6C78" text-anchor="middle" id="handle">@trado_cl</text>
</svg>
