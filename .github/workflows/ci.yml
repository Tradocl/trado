name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
